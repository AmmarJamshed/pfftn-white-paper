<svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Identity to Payment chain">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B4D8"/><stop offset="100%" stop-color="#1A6FBF"/>
    </linearGradient>
  </defs>
  <rect width="900" height="160" fill="#0B1F3A" rx="16"/>
  <g font-family="DM Sans,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="20" y="50" width="140" height="60" rx="12" fill="url(#g1)"/>
    <text x="90" y="85">IDENTITY</text>
    <text x="175" y="85" fill="#00B4D8" font-size="22">→</text>
    <rect x="195" y="50" width="120" height="60" rx="12" fill="#1A6FBF"/>
