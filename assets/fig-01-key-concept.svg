<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="900" height="200" fill="#F8FAFC" rx="12"/>
  <text x="450" y="30" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="16" fill="#0B1F3A" font-weight="700">The Key Idea — in one picture</text>
  <g font-family="DM Sans,sans-serif" font-size="11" text-anchor="middle" fill="#fff">
    <rect x="40" y="55" width="110" height="50" rx="10" fill="#FBBF24"/><text x="95" y="85" fill="#78350F" font-weight="700">CUSTOMER</text>
    <text x="165" y="85" fill="#00B4D8" font-size="16">↓</text>
    <rect x="40" y="115" width="110" height="36" rx="8" fill="#1A6FBF"/><text x="95" y="138">DIGITAL ID</text>
    <rect x="170" y="85" width="120" height="50" rx="10" fill="#00B4D8"/><text x="230" y="115">VERIFIABLE</text><text x="230" y="128" font-size="9">CREDENTIALS</text>
    <rect x="310" y="85" width="100" height="50" rx="10" fill="#0D9488"/><text x="360" y="115">CONSENT</text>
