    <rect x="610" y="85" width="130" height="50" rx="10" fill="#5B4B8A"/><text x="675" y="115">BANK / EMI</text>
    <rect x="760" y="85" width="110" height="50" rx="10" fill="#059669"/><text x="815" y="105">ACCOUNT /</text><text x="815" y="120" font-size="9">WALLET / MCHT</text>
