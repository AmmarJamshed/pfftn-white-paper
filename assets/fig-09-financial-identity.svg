<svg width="2250" height="800" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="900" height="320" fill="#F0F9FF" rx="12"/>
  <text x="450" y="32" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="18" fill="#0B1F3A" font-weight="700">Financial Identity Credential (Proposed)</text>
  <rect x="300" y="55" width="300" height="50" rx="12" fill="#1A6FBF"/>
  <text x="450" y="86" text-anchor="middle" fill="#fff" font-family="DM Sans,sans-serif" font-size="17" font-weight="700">CUSTOMER DIGITAL WALLET / HOLDER</text>
  <g font-family="DM Sans,sans-serif" font-size="16" text-anchor="middle">
    <rect x="40" y="130" width="130" height="55" rx="8" fill="#0D9488"/><text x="105" y="155" fill="#fff">CNIC verified</text><text x="105" y="170" fill="#CCFBF1">✓ attestation</text>
    <rect x="185" y="130" width="130" height="55" rx="8" fill="#14B8A6"/><text x="250" y="155" fill="#fff">Address</text><text x="250" y="170" fill="#CCFBF1">✓ attestation</text>
    <rect x="330" y="130" width="130" height="55" rx="8" fill="#00B4D8"/><text x="395" y="155" fill="#fff">Biometric</text><text x="395" y="170" fill="#E0F2FE">✓ attestation</text>
    <rect x="475" y="130" width="130" height="55" rx="8" fill="#5B4B8A"/><text x="540" y="155" fill="#fff">Income / Tax</text><text x="540" y="170" fill="#EDE9FE">✓ attestation</text>
    <rect x="620" y="130" width="130" height="55" rx="8" fill="#1A6FBF"/><text x="685" y="155" fill="#fff">KYC / CDD</text><text x="685" y="170" fill="#BFDBFE">status</text>
    <rect x="765" y="130" width="105" height="55" rx="8" fill="#0B1F3A"/><text x="817" y="155" fill="#fff">Risk</text><text x="817" y="170" fill="#94A3B8">class</text>
  </g>
  <text x="450" y="230" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="17" fill="#1A6FBF" font-weight="700">Verifiable credential = a digital proof that a fact was already verified</text>
  <text x="450" y="260" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="17" fill="#64748B">Selective disclosure: show only what the relying party is allowed to see</text>
  <text x="450" y="290" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="17" fill="#94A3B8">Raw documents stay off-chain with custodians / holders</text>
</svg>