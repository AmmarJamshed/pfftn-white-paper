<svg width="2250" height="950" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="900" height="380" fill="#ECFDF5" rx="12"/>
  <text x="450" y="32" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="18" fill="#0B1F3A" font-weight="700">MFI — Merchant Financial Identity (Proposed)</text>
  <rect x="280" y="50" width="340" height="55" rx="14" fill="#0D9488"/>
  <text x="450" y="75" text-anchor="middle" fill="#fff" font-family="DM Sans,sans-serif" font-size="17" font-weight="700">NATIONAL MERCHANT FINANCIAL IDENTITY</text>
  <text x="450" y="95" text-anchor="middle" fill="#CCFBF1" font-family="DM Sans,sans-serif" font-size="17">Reusable · Permissioned · Consent-driven</text>
  <g font-family="DM Sans,sans-serif" font-size="17" fill="#065F46">
    <rect x="40" y="130" width="200" height="100" rx="10" fill="#fff" stroke="#6EE7B7"/><text x="50" y="155" font-weight="700">Legal &amp; Tax</text><text x="50" y="175">CNIC / legal ID</text><text x="50" y="193">NTN (if applicable)</text><text x="50" y="211">Business registration</text>
    <rect x="250" y="130" width="200" height="100" rx="10" fill="#fff" stroke="#6EE7B7"/><text x="260" y="155" font-weight="700">Ownership</text><text x="260" y="175">Beneficial ownership</text><text x="260" y="193">Business category</text><text x="260" y="211">Risk profile</text>
    <rect x="460" y="130" width="200" height="100" rx="10" fill="#fff" stroke="#6EE7B7"/><text x="470" y="155" font-weight="700">Compliance</text><text x="470" y="175">KYC / CDD status</text><text x="470" y="193">EDD status</text><text x="470" y="211">Verification history</text>
    <rect x="670" y="130" width="200" height="100" rx="10" fill="#fff" stroke="#6EE7B7"/><text x="680" y="155" font-weight="700">Payments</text><text x="680" y="175">Settlement accounts</text><text x="680" y="193">Raast merchant ID</text><text x="680" y="211">QR / acquiring links</text>
  </g>
  <rect x="40" y="255" width="820" height="90" rx="12" fill="#0B1F3A"/>
  <text x="450" y="290" text-anchor="middle" fill="#00B4D8" font-family="DM Sans,sans-serif" font-size="17" font-weight="700">Not every institution sees every field</text>
  <text x="450" y="315" text-anchor="middle" fill="#94A3B8" font-family="DM Sans,sans-serif" font-size="17">Access is permissioned, consent-driven, and subject to law &amp; regulatory requirements</text>
</svg>