<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="900" height="280" fill="#F8FAFC" rx="12"/>
  <g font-family="DM Sans,sans-serif" text-anchor="middle">
    <rect x="30" y="40" width="270" height="200" rx="14" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="165" y="75" font-size="14" font-weight="700" fill="#92400E">Traditional Banking</text>
    <text x="165" y="110" font-size="12" fill="#78350F">Centralized</text>
    <text x="165" y="130" font-size="12" fill="#78350F">institutional trust</text>
    <text x="165" y="170" font-size="11" fill="#A16207">Each bank is its own</text>
    <text x="165" y="188" font-size="11" fill="#A16207">island of verification</text>

    <rect x="315" y="30" width="270" height="220" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
    <text x="450" y="60" font-size="12" fill="#1D4ED8" font-weight="700">RECOMMENDED PATH</text>
    <text x="450" y="90" font-size="14" font-weight="700" fill="#1E3A8A">Federated Banking</text>
    <text x="450" y="125" font-size="12" fill="#1E40AF">Distributed</text>
    <text x="450" y="145" font-size="12" fill="#1E40AF">institutional trust</text>
    <text x="450" y="185" font-size="11" fill="#1D4ED8">Shared proofs.</text>
    <text x="450" y="203" font-size="11" fill="#1D4ED8">Regulated decisions.</text>
    <text x="450" y="221" font-size="11" fill="#1D4ED8">PFFTN model.</text>

    <rect x="600" y="40" width="270" height="200" rx="14" fill="#F3E8FF" stroke="#A855F7"/>
    <text x="735" y="75" font-size="14" font-weight="700" fill="#6B21A8">Permissionless DeFi</text>
    <text x="735" y="110" font-size="12" fill="#581C87">Protocol-based trust</text>
    <text x="735" y="145" font-size="11" fill="#7E22CE">Useful for research,</text>
    <text x="735" y="163" font-size="11" fill="#7E22CE">but poorly suited as</text>
    <text x="735" y="181" font-size="11" fill="#7E22CE">Pakistan's primary</text>
    <text x="735" y="199" font-size="11" fill="#7E22CE">banking trust layer</text>
  </g>
</svg>