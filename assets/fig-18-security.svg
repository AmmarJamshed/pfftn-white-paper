<svg width="2250" height="700" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="900" height="280" fill="#450A0A" rx="12"/>
  <text x="450" y="32" text-anchor="middle" fill="#FECACA" font-family="DM Sans,sans-serif" font-size="17" font-weight="700">SECURITY THREAT SURFACE (illustrative)</text>
  <g font-family="DM Sans,sans-serif" font-size="16" text-anchor="middle" fill="#fff">
    <rect x="20" y="55" width="140" height="45" rx="8" fill="#DC2626"/><text x="90" y="82">Private keys</text>
    <rect x="175" y="55" width="140" height="45" rx="8" fill="#EF4444"/><text x="245" y="82">Credential theft</text>
    <rect x="330" y="55" width="140" height="45" rx="8" fill="#F87171"/><text x="400" y="82">Node compromise</text>
    <rect x="485" y="55" width="140" height="45" rx="8" fill="#B91C1C"/><text x="555" y="82">Insider threats</text>
    <rect x="640" y="55" width="120" height="45" rx="8" fill="#991B1B"/><text x="700" y="82">False creds</text>
    <rect x="775" y="55" width="105" height="45" rx="8" fill="#7F1D1D"/><text x="827" y="82">Collusion</text>
    <rect x="80" y="120" width="160" height="45" rx="8" fill="#9F1239"/><text x="160" y="147">Smart-contract bugs</text>
    <rect x="260" y="120" width="160" height="45" rx="8" fill="#BE123C"/><text x="340" y="147">Data poisoning</text>
    <rect x="440" y="120" width="160" height="45" rx="8" fill="#E11D48"/><text x="520" y="147">Identity theft</text>
    <rect x="620" y="120" width="200" height="45" rx="8" fill="#F43F5E"/><text x="720" y="147">Recovery failures</text>
  </g>
  <text x="450" y="210" text-anchor="middle" fill="#FECACA" font-family="DM Sans,sans-serif" font-size="17" font-weight="700">Decentralization does NOT automatically equal security.</text>
  <text x="450" y="240" text-anchor="middle" fill="#FDA4AF" font-family="DM Sans,sans-serif" font-size="17">Defense requires keys, ops, governance, audits, and incident response.</text>
</svg>