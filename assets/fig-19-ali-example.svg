<svg width="1800" height="800" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/><stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#sky)" rx="12"/>
  <text x="450" y="32" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="18" fill="#0B1F3A" font-weight="700">Ali is 18 and wants his first bank account</text>
  <g font-family="DM Sans,sans-serif" font-size="15" text-anchor="middle">
    <circle cx="80" cy="100" r="28" fill="#FBBF24"/><text x="80" y="105" font-size="20">🙂</text>
    <text x="80" y="150" fill="#0B1F3A" font-weight="700">Ali</text>
    <text x="140" y="105" fill="#00B4D8" font-size="18">→</text>
    <rect x="160" y="80" width="120" height="50" rx="10" fill="#1A6FBF"/><text x="220" y="110" fill="#fff">Verifies ID</text>
    <text x="300" y="105" fill="#00B4D8" font-size="18">→</text>
    <rect x="320" y="80" width="140" height="50" rx="10" fill="#5B4B8A"/><text x="390" y="110" fill="#fff">Gets credentials</text>
    <text x="480" y="105" fill="#00B4D8" font-size="18">→</text>
    <rect x="500" y="80" width="140" height="50" rx="10" fill="#0D9488"/><text x="570" y="110" fill="#fff">Bank verifies</text>
    <text x="660" y="105" fill="#00B4D8" font-size="18">→</text>
    <rect x="680" y="80" width="160" height="50" rx="10" fill="#059669"/><text x="760" y="110" fill="#fff">Account opened!</text>
  </g>
  <rect x="60" y="190" width="780" height="170" rx="14" fill="#fff" stroke="#A7F3D0"/>
  <text x="450" y="220" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="16" font-weight="700" fill="#047857">Then Ali buys something…</text>
  <g font-family="DM Sans,sans-serif" font-size="15" text-anchor="middle">
    <rect x="100" y="245" width="150" height="70" rx="10" fill="#DBEAFE"/><text x="175" y="275" fill="#1E40AF" font-weight="700">Pays merchant</text><text x="175" y="295" fill="#3B82F6">via bank / EMI</text>
    <rect x="280" y="245" width="150" height="70" rx="10" fill="#D1FAE5"/><text x="355" y="275" fill="#065F46" font-weight="700">Merchant already</text><text x="355" y="295" fill="#059669">verified (MFI)</text>
    <rect x="460" y="245" width="150" height="70" rx="10" fill="#CCFBF1"/><text x="535" y="275" fill="#0F766E" font-weight="700">Raast settles</text><text x="535" y="295" fill="#14B8A6">the payment</text>
    <rect x="640" y="245" width="150" height="70" rx="10" fill="#EDE9FE"/><text x="715" y="275" fill="#5B21B6" font-weight="700">Auditable trail</text><text x="715" y="295" fill="#7C3AED">for both sides</text>
  </g>
</svg>